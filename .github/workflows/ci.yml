name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw --version=13.2.0 -y

      - name: Install pkg-config (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://sourceforge.net/projects/pkgconfiglite/files/latest/download" -o pkgconfiglite.zip
          unzip -o -q pkgconfiglite.zip
          echo "$GITHUB_WORKSPACE/pkg-config-lite-0.28-1/bin" >> "$GITHUB_PATH"

      - name: Install Ninja and pkg-config (Linux)
        if: runner.os != 'Windows'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config

      - name: Cache vcpkg archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Cache vcpkg archives (Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: .\vcpkg\bootstrap-vcpkg.bat

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake --preset default

      - name: Configure (Linux)
        if: runner.os != 'Windows'
        run: cmake --preset linux

      - name: Build
        run: cmake --build build

      - name: Run spike tests
        run: |
          ctest --test-dir build --output-on-failure || true
